#:schema https://mise.jdx.dev/schema/mise-task.json
dev = "nix develop --command $SHELL"

init = "just init"

upgrade = "just bump-nix"

"clean:artifacts" = "rm -rf {{vars.out}}"
"clean:cache:build" = "rm -rf {{vars.build}}"
"clean:cache:nix" = "nix-collect-garbage --delete-old"
clean = "mise run clean:artifacts ::: clean:cache:build"

["clean:_all"]
hide = true
run = [ "just clean", "rm -rf .west zmk" ]

["clean:all"]
run = [ "mise run clean:_all", "mise run clean:cache:nix" ]
confirm = "Are you sure you want to clean _everything_?"

[update]
run = "just sync"
sources = [ "config/west.yml", ".west/*" ]
outputs = { auto = true }

[build]
usage = '''
arg "<target>" default="corne_"
complete "target" run="just list"
'''
run = 'just build "${usage_target?}"'
sources = [ "config/*", "modules/*", "build.yaml", "Justfile", "flake.nix", "flake.lock" ]
outputs = [ "{{vars.out}}/corne_*.uf2" ] # NOTE: would be nice if this supported {{arg(name='target')}}
depends = [ "update" ]
